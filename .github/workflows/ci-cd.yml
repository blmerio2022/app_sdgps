name: CI/CD

# Stratégie « tag-based, rebuild par palier » :
#   push feature/**               → TESTS → `railway up` sur le projet de TEST (sdgps-test) :
#                                   chaque commit poussé de la version en cours est en ligne
#                                   quelques minutes plus tard (job `deploy-test`, upstream).
#   push develop                  → BUILD → GHCR :sha-<court> + :staging → redeploy Railway STAGING.
#   tag git v*.*.*-rc.* (PREPROD) → BUILD depuis le tag → :<tag> + :preprod → redeploy PREPROD.
#   tag git v*.*.* (PRODUCTION)   → BUILD depuis le tag → :<tag> + :production → redeploy PRODUCTION.
#
# Contrairement à l'ancienne stratégie « build once, promote », preprod et production sont ici
# de VRAIS rebuilds depuis le TAG git (pas de promotion de digest).
#
# Les jobs d'image tournent UNIQUEMENT dans le fork (onedevaus/app_sdgps, où sont les tokens
# Railway) ; l'upstream blmerio2022 y mirrore branches ET tags via sync-fork.yml.
#
# Distinction des tags (GitHub Actions n'a pas de regex) :
#   - preprod    : tag qui contient « -rc. »        (ex. v2.3.0-rc.1)
#   - production : tag SANS aucun « - »              (ex. v2.3.0) → exclut rc/alpha/beta

on:
  push:
    branches: [main, develop, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # CI = tests applicatifs sur SQLite (comme l'environnement de développement).
    # ENVIRONMENT non défini → 'development' → SQLite.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        # `requirements-dev.txt` ajoute les outils de TEST (serveur S3 moto) : sans eux,
        # `analytics/tests_object_storage.py` se contenterait de s'auto-ignorer et la
        # bascule vers le stockage objet ne serait plus vérifiée en CI.
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Appliquer les migrations
        # Seed désactivé : les tests tournent sur la base de test (TESTING=True → seed déjà
        # neutralisé) ; inutile d'amorcer la base de dev jetable de la CI.
        run: SEED_INITIAL_DATA=0 python manage.py migrate
      - name: Lancer les tests
        run: python manage.py test --verbosity=2

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps
      - name: Lancer les tests unitaires (Karma / Jasmine, headless)
        run: npm run test:ci
      - name: Builder le frontend
        run: npx ng build --configuration production

  # ─────────────────────────────────────────────────────────────────────────────
  # TEST (push feature/**) : TESTS → envoi de l'arbre de travail → Railway `sdgps-test`.
  #
  # Chaque commit de la branche de version, poussé aussitôt (règle du dépôt), met à jour
  # l'application de test SANS geste manuel — l'ancien `railway up` depuis un poste
  # oubliait régulièrement des commits. Le déploiement attend les DEUX suites de tests :
  # un commit rouge n'est jamais mis en ligne.
  #
  # Tourne dans l'UPSTREAM (blmerio2022), contrairement aux jobs d'image : le projet de
  # test n'a pas d'image GHCR, Railway construit le Dockerfile racine depuis l'envoi.
  # Secret requis : RAILWAY_TOKEN_TEST = jeton de PROJET Railway (sdgps-test, environnement
  # « production »). Variables facultatives : RAILWAY_TEST_SERVICE (défaut « app »),
  # RAILWAY_TEST_URL (défaut : domaine public actuel) pour le contrôle après déploiement.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-test:
    needs: [test-backend, test-frontend]
    if: github.repository == 'blmerio2022/app_sdgps' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    # Des pushes rapprochés : seul le DERNIER commit compte — un déploiement en cours d'un
    # commit déjà dépassé est annulé plutôt que de mettre en ligne une version périmée.
    concurrency:
      group: deploy-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique + tags complets : la version (v1.0.N) se calcule depuis git.
          fetch-depth: 0

      - name: Vérifier le jeton Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TEST }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error title=Déploiement de test impossible::Secret RAILWAY_TOKEN_TEST absent. Railway › sdgps-test › Settings › Tokens : créer un jeton de projet (environnement production), puis : gh secret set RAILWAY_TOKEN_TEST --repo blmerio2022/app_sdgps"
            exit 1
          fi

      - name: Calculer la version (build-info/version.json)
        # Le serveur n'a pas l'historique git : la version est figée avant l'envoi
        # (`.railwayignore` force l'envoi de ce fichier ignoré par git).
        run: python3 backend/backend/version.py --ecrire build-info/version.json

      - name: Déployer sur Railway (sdgps-test)
        env:
          JETON: ${{ secrets.RAILWAY_TOKEN_TEST }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_TEST_SERVICE || 'app' }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_TEST_PROJECT_ID || 'd9f8bb0b-2da6-4536-9214-8fc67c7003fb' }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_TEST_ENVIRONMENT || 'production' }}
        # Railway délivre deux sortes de jetons, lus par deux variables DIFFÉRENTES :
        #  - jeton de PROJET (projet › Settings › Tokens) → RAILWAY_TOKEN, déjà lié à
        #    un projet et un environnement ;
        #  - jeton de COMPTE / d'ÉQUIPE (paramètres du compte) → RAILWAY_API_TOKEN, qui
        #    exige de désigner le projet et l'environnement (`railway link`).
        # On détecte la sorte de jeton plutôt que d'exiger la bonne : l'erreur
        # « Invalid RAILWAY_TOKEN » d'un jeton de compte est trompeuse.
        # `--ci` : suit la construction et échoue si elle échoue — le job reflète l'état
        # réel du déploiement, au lieu de réussir dès l'envoi (`--detach`).
        run: |
          npm install -g @railway/cli --allow-scripts=@railway/cli
          # Copier-coller tolérant : espaces / retours ligne, guillemets, et préfixe
          # « RAILWAY_TOKEN= » (Railway affiche le jeton sous cette forme, prête à coller
          # dans un .env — c'est souvent toute la ligne qui finit dans le secret).
          JETON="$(printf '%s' "$JETON" | tr -d '[:space:]"'"'"'' | sed -E 's/^(export)?[A-Za-z_]*TOKEN=//')"
          echo "Jeton : ${#JETON} caractères."
          # (1) jeton de PROJET : `status` lit le projet et l'environnement portés par le jeton.
          if sortie_projet="$(RAILWAY_TOKEN="$JETON" railway status 2>&1)"; then
            echo "Jeton de projet Railway détecté."
            export RAILWAY_TOKEN="$JETON"
          # (2) jeton de COMPTE ou d'ÉQUIPE : on lie directement le projet (`whoami` échoue
          #     avec un jeton d'équipe, pourtant valide pour déployer).
          elif sortie_compte="$(RAILWAY_API_TOKEN="$JETON" railway link --project "$RAILWAY_PROJECT_ID"                  --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE" 2>&1)"; then
            echo "Jeton de compte / d'équipe Railway détecté : projet $RAILWAY_PROJECT_ID lié ($RAILWAY_ENVIRONMENT)."
            export RAILWAY_API_TOKEN="$JETON"
          else
            echo "Réponse de Railway — jeton de projet : $sortie_projet"
            echo "Réponse de Railway — jeton de compte  : $sortie_compte"
            echo "::error title=Jeton Railway refusé::Le secret RAILWAY_TOKEN_TEST n'est accepté ni comme jeton de projet ni comme jeton de compte (expiré, révoqué, mal copié, ou créé pour un autre projet / environnement). Détail de Railway ci-dessus."
            exit 1
          fi
          railway up --service "$RAILWAY_SERVICE" --ci

      - name: Contrôler la version en ligne
        env:
          URL: ${{ vars.RAILWAY_TEST_URL || 'https://app-production-4e77e566.up.railway.app' }}
        # Le nouveau conteneur peut mettre quelques instants à prendre le relais : on sonde
        # `/api/version/` (public) jusqu'à y lire le commit qui vient d'être poussé.
        run: |
          attendu="$(git rev-parse --short HEAD)"   # même forme que backend/backend/version.py
          for i in $(seq 1 30); do
            en_ligne="$(curl -fsS "$URL/api/version/" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' || true)"
            if [ "$en_ligne" = "$attendu" ]; then
              echo "✅ En ligne : commit $en_ligne — $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Version en ligne inattendue::attendu $attendu, en ligne « $en_ligne » ($URL)"
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGING (push develop) : BUILD → :sha-<court> + :staging → redeploy STAGING.
  # ─────────────────────────────────────────────────────────────────────────────
  build-staging:
    needs: [test-backend, test-frontend]
    # Jobs d'image = UNIQUEMENT dans le fork (onedevaus/app_sdgps), pas dans l'upstream.
    if: github.repository != 'blmerio2022/app_sdgps' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique + tags complets : la version (v1.0.N) se calcule depuis git.
          fetch-depth: 0

      - name: Calculer la version (build-info/version.json)
        # Repère base/vX.Y absent → image sans version (« inconnue ») plutôt que build bloqué.
        run: python3 backend/backend/version.py --ecrire build-info/version.json || echo "version indisponible"

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=staging

      - name: Builder et pousser l'image racine (app complète)
        # context: . → Dockerfile racine (SPA Angular buildé PUIS servi par Django/WhiteNoise).
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Redéployer STAGING sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE" --yes

  # ─────────────────────────────────────────────────────────────────────────────
  # PREPROD (tag v*.*.*-rc.*) : BUILD depuis le tag → :<tag> + :preprod → redeploy PREPROD.
  # ─────────────────────────────────────────────────────────────────────────────
  build-preprod:
    needs: [test-backend, test-frontend]
    if: github.repository != 'blmerio2022/app_sdgps' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique + tags complets : la version (v1.0.N) se calcule depuis git.
          fetch-depth: 0

      - name: Calculer la version (build-info/version.json)
        # Repère base/vX.Y absent → image sans version (« inconnue ») plutôt que build bloqué.
        run: python3 backend/backend/version.py --ecrire build-info/version.json || echo "version indisponible"

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=preprod

      - name: Builder et pousser l'image (depuis le tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Redéployer PREPROD sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PREPROD }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE" --yes

  # ─────────────────────────────────────────────────────────────────────────────
  # PRODUCTION (tag v*.*.* sans « - ») : BUILD depuis le tag → :<tag> + :production → redeploy PROD.
  # ─────────────────────────────────────────────────────────────────────────────
  build-production:
    needs: [test-backend, test-frontend]
    if: github.repository != 'blmerio2022/app_sdgps' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique + tags complets : la version (v1.0.N) se calcule depuis git.
          fetch-depth: 0

      - name: Calculer la version (build-info/version.json)
        # Repère base/vX.Y absent → image sans version (« inconnue ») plutôt que build bloqué.
        run: python3 backend/backend/version.py --ecrire build-info/version.json || echo "version indisponible"

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=production

      - name: Builder et pousser l'image (depuis le tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Redéployer PRODUCTION sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE" --yes
